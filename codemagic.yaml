workflows:
  android-debug:
    name: AnimeVault Android APK
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: 3.47.5

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Generate Android platform
        script: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --project-name animevault .
          fi

      - name: Build debug APK
        script: |
          flutter build apk --debug

      - name: Collect APK artifact
        script: |
          set -e
          mkdir -p artifacts
          APK_PATH=$(find build -type f -name "app-debug.apk" -print -quit)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: app-debug.apk was not generated."
            echo "Build directory contents:"
            find build -maxdepth 5 -type f 2>/dev/null || true
            exit 1
          fi
          cp "$APK_PATH" "artifacts/AnimeVault-debug.apk"
          echo "APK artifact: artifacts/AnimeVault-debug.apk"

    artifacts:
      - artifacts/AnimeVault-debug.apk
